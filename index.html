<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu-overlay">
    <div class="panel">
      <h1>Shared Counter</h1>
      <p class="subtitle">P2P test &mdash; connects two browsers directly, no server needed.</p>

      <div class="menu-section">
        <h2>Host a game</h2>
        <button id="btn-host">Create Room</button>
        <div id="host-code-wrap" class="hidden">
          <p>Share this code with your friend:</p>
          <div class="code-box" id="host-code">------</div>
          <p class="status" id="host-status">Waiting for opponent to join&hellip;</p>
        </div>
      </div>

      <div class="menu-section">
        <h2>Join a game</h2>
        <input id="join-code-input" placeholder="Enter room code" autocomplete="off" spellcheck="false" />
        <button id="btn-join">Join Room</button>
        <p class="status" id="join-status"></p>
      </div>
    </div>
  </div>

  <div id="counter-screen" class="hidden">
    <p class="conn-status" id="conn-status">Connected</p>
    <div class="counter-value" id="counter-value">0</div>
    <button id="btn-increment">+1</button>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
