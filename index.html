<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reroute</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu-overlay">
    <div class="panel">
      <h1>Reroute</h1>
      <p class="subtitle">1v1 train duel &mdash; connects two browsers directly, no server needed.</p>

      <div class="menu-section">
        <h2>Practice</h2>
        <button id="btn-bot">Play vs Bot</button>
      </div>

      <div class="menu-section">
        <h2>Host a game</h2>
        <button id="btn-host">Create Room</button>
        <div id="host-code-wrap" class="hidden">
          <p>Share this code with your friend:</p>
          <div class="code-box" id="host-code">------</div>
          <p class="status" id="host-status">Waiting for opponent to join&hellip;</p>
        </div>
      </div>

      <div class="menu-section">
        <h2>Join a game</h2>
        <input id="join-code-input" placeholder="Enter room code" autocomplete="off" spellcheck="false" />
        <button id="btn-join">Join Room</button>
        <p class="status" id="join-status"></p>
      </div>
    </div>
  </div>

  <div id="game-screen" class="hidden">
    <div class="half opp-half">
      <p class="side-label">Opponent &middot; <span id="opp-hp">10</span> HP</p>
      <div class="hp-bar"><div id="opp-hp-fill" class="hp-fill"></div></div>
      <div id="opp-train" class="train"></div>
    </div>

    <div class="center-strip">
      <p id="round-info">Round 1</p>
      <p id="wait-status" class="status hidden">Waiting for opponent...</p>
      <div id="log"></div>
    </div>

    <div class="half my-half">
      <div id="my-train" class="train"></div>
      <p class="side-label">You &middot; <span id="my-hp">10</span> HP</p>
      <div class="hp-bar"><div id="my-hp-fill" class="hp-fill"></div></div>

      <div id="hand"></div>
      <button id="btn-pass">Pass</button>

      <div id="target-area" class="hidden">
        <p>Choose a target:</p>
        <div id="target-list"></div>
        <button id="target-cancel">Cancel</button>
      </div>
    </div>

    <div id="game-over" class="hidden">
      <div class="panel">
        <p id="game-over-text"></p>
        <button id="btn-restart">Play Again</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
